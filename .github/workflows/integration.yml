name: Cross-project integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 30
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake ninja-build python3 python3-venv \
            clang clang-21 llvm-21-dev llvm-21-tools lld-21
      - name: Check out the revision under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: qsbit-compiler
      - name: Check out qsbit-sim main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: qsbit-org/qsbit-sim
          ref: main
          path: qsbit-sim
      - name: Record tested revisions
        run: |
          git -C qsbit-compiler rev-parse HEAD
          git -C qsbit-sim rev-parse HEAD
      - name: Select integration Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked simulator dependencies
        working-directory: qsbit-sim
        run: |
          python -m pip install uv==0.12.7
          uv sync --frozen --python "$(command -v python)" --group build --extra aer --extra qec
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Build simulator with Aer support
        working-directory: qsbit-sim
        run: |
          conan config install conan/config
          conan install . -pr:a=conan/profiles/clang --build=missing -c tools.build:jobs=2
          cmake --preset clang-ninja -DBUILD_TESTING=OFF -DQSBIT_BUILD_EXAMPLES=OFF \
            -DQSBIT_PYTHON_BACKENDS=ON -DPython3_EXECUTABLE="$PWD/.venv/bin/python"
          cmake --build --preset clang-ninja --parallel 2
          cmake --install build-clang --prefix "$RUNNER_TEMP/qsbit"
          echo "$RUNNER_TEMP/qsbit/bin" >> "$GITHUB_PATH"
      - name: Build compiler and register integration tests
        working-directory: qsbit-compiler
        run: |
          cmake --preset clang-ninja -DBUILD_TESTING=ON -DQSBIT_TEST_AER=ON -DQSBIT_TEST_QEC=ON \
            -DQSBIT_SIM_EXECUTABLE="$RUNNER_TEMP/qsbit/bin/qsbit-sim"
          cmake --build --preset clang-ninja --parallel 2
          cmake --install build-clang --prefix "$RUNNER_TEMP/qsbit"
          uv pip install --python "$VIRTUAL_ENV/bin/python" .
      - name: Run installed commands
        working-directory: qsbit-compiler
        run: |
          qsbitc examples/bell.ll --target targets/sim-default.json -o build-clang/installed/bell.elf
          qsbit-run build-clang/installed/bell.elf --backend aer --shots 2 --out-dir build-clang/installed/results
      - name: Test measurement results, Bell states and decoder feedback
        working-directory: qsbit-compiler
        run: ctest --preset clang-ninja --no-tests=error -R '^integration\.(mock|aer|qec)$'
      - name: Validate decoder configuration and surface-code example
        working-directory: qsbit-sim
        run: |
          python tests/decoding.py
          python examples/qec/run.py --output build-clang/qec --shots 2
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cross-project-test-logs
          path: qsbit-compiler/build-clang/Testing/
