name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    strategy:
      matrix:
        preset: [clang-ninja, gcc-ninja]
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake ninja-build python3 python3-jsonschema \
            clang-21 llvm-21-dev llvm-21-tools lld-21 clang-format-21 clang-tidy-21
      - uses: actions/checkout@v4
      - name: Check formatting
        run: clang-format-21 --dry-run --Werror lib/*/*.hpp lib/*/*.cpp tests/*.cpp tools/qsbitc/main.cpp
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Static analysis
        if: matrix.preset == 'clang-ninja'
        run: clang-tidy-21 -p build-clang lib/*/*.cpp tools/qsbitc/main.cpp --warnings-as-errors='*'
